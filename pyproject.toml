    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langchain-unstructured>=1.0.1",
    "langchainhub>=0.1.21",
    "langgraph>=1.2.11",
    "langsmith>=0.12.4",
    "nltk>=3.10.3",
    "openai>=3.13.0",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
    "streamlit-chat>=0.1.1",
    "tavily-python>=0.8.3",
    "tiktoken>=0.14.0",
    "tqdm>=4.70.1",
    "unstructured>=0.27.6",
    "uvicorn>=0.53.0",
